[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epilepsy-ml-pipeline"
version = "1.0.0"
description = "Machine learning pipeline for epilepsy prediction from EEG and biomedical data"
readme = "README.md"
requires-python = ">=3.15"
authors = [{ name = "Saniya Vaish", email = "3017061@gmail.com" }]
keywords = ["machine-learning", "epilepsy", "eeg", "computational-biology", "pytorch", "scikit-learn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "numpy>=2.5",
    "pandas>=3.0",
    "scipy>=1.18",
    "scikit-learn>=1.9",
    "matplotlib>=3.11",
    "seaborn>=0.13",
    "PyWavelets>=1.10",
    # Python 3.15 wheels are published on download.pytorch.org, not PyPI (see requirements.txt)
    "torch>=2.14",
]

[project.optional-dependencies]
notebooks = ["notebook>=7.6", "ipykernel>=7.4", "ipywidgets>=8.1", "plotly>=7.1"]
# gradio is not listed: its dependency brotli has no Python 3.15 wheel yet
extras = ["openml>=0.15", "shap>=0.54"]

[project.urls]
Homepage = "https://github.com/3017061/epilepsy-ml-pipeline"
Issues = "https://github.com/3017061/epilepsy-ml-pipeline/issues"

[tool.setuptools.packages.find]
include = ["src*"]
